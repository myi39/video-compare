<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>video-compare — タイムアタック動画比較</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0d0e12;
    --panel: #16171d;
    --panel2: #1c1d24;
    --border: #26272e;
    --text: #e6e7eb;
    --text2: #8a8f98;
    --accent: #5e6ad2;
    --green: #4cb782;
    --red: #eb5757;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: calc(78px + env(safe-area-inset-bottom));
    font-size: 15px;
  }
  button, select { font-family: inherit; touch-action: manipulation; }  /* 連打時のダブルタップズームを抑止 */
  header {
    padding: 10px 16px 4px;
    display: flex; align-items: baseline; justify-content: space-between;
  }
  header h1 { font-size: 0.9rem; margin: 0; font-weight: 600; }
  header .note { font-size: 0.65rem; color: var(--text2); }

  .panel {
    margin: 8px 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .video-area {
    position: relative;
    aspect-ratio: 16 / 9;
    max-height: 40vh;   /* dvh非対応ブラウザ用フォールバック */
    max-height: 40dvh;  /* 横持ち等の極端な画面比への保険。縦持ちでは16:9全幅が常に優先される */
    background: #101116;
    display: flex; align-items: center; justify-content: center;
  }
  .video-area video {
    width: 100%; height: 100%;
    object-fit: contain;   /* 縦長動画は左右余白（ピラーボックス） */
    background: #000;
  }
  .badge {
    position: absolute; top: 6px; left: 8px;
    font-size: 0.62rem; color: var(--text2);
    background: rgba(13,14,18,0.7); border-radius: 5px; padding: 2px 7px;
    z-index: 1;
  }
  .pick-btn {
    background: transparent; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 20px; font-size: 0.85rem; font-weight: 500;
  }
  .err {
    position: absolute; margin: 0;
    color: var(--red); font-size: 0.75rem;
  }

  .ctrlrow {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px;
  }
  .playone {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; width: 38px; height: 26px; font-size: 0.8rem;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .seekwrap { position: relative; flex: 1; display: flex; align-items: center; }
  .seek {
    -webkit-appearance: none; appearance: none;
    width: 100%; background: transparent; margin: 0; height: 20px;
    touch-action: manipulation;
  }
  .seek::-webkit-slider-runnable-track {
    height: 4px; background: #26272e; border-radius: 2px;
  }
  .seek::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px; border-radius: 50%; background: #fff;
    margin-top: -6px; box-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  .seek::-moz-range-track { height: 4px; background: #26272e; border-radius: 2px; }
  .seek::-moz-range-thumb {
    width: 16px; height: 16px; border: none; border-radius: 50%; background: #fff;
  }
  .seek:disabled::-webkit-slider-thumb { background: #4a5060; }
  .seek:disabled::-moz-range-thumb { background: #4a5060; }
  .amark, .bmark {
    position: absolute; top: -7px; font-size: 0.55rem; font-weight: 700;
    transform: translateX(-50%); pointer-events: none;
  }
  .amark { color: var(--green); }
  .bmark { color: var(--red); }
  .time {
    font-variant-numeric: tabular-nums; font-size: 0.72rem; color: var(--text2);
    flex-shrink: 0;
  }
  .time b { color: var(--text); font-weight: 500; }
  .tune-toggle {
    background: transparent; border: none; color: var(--text2);
    font-size: 0.85rem; width: 30px; height: 26px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .tune-toggle.open { color: var(--accent); }

  .tune {
    display: grid;
    grid-template-rows: 0fr;   /* アコーディオン: 0fr→1fr をアニメーション */
    transition: grid-template-rows 0.25s ease;
  }
  .tune.open { grid-template-rows: 1fr; }
  .tune-inner { overflow: hidden; min-height: 0; }
  .tune-pad {
    border-top: 1px solid var(--border);
    background: var(--panel2);
    padding: 10px 10px 11px;
  }
  .steprow { display: flex; gap: 5px; }
  .steprow button {
    flex: 1; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 7px;
    padding: 9px 0; font-size: 0.7rem; font-variant-numeric: tabular-nums;
  }
  .abrow { display: flex; gap: 6px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
  .abrow button {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 7px; padding: 8px 14px; font-size: 0.72rem; color: var(--text);
  }
  .abrow .aset { color: var(--green); }
  .abrow .bset { color: var(--red); }
  .abrow .abval { font-size: 0.68rem; color: var(--text2); font-variant-numeric: tabular-nums; margin-left: auto; }

  .hint {
    margin: 2px 16px; font-size: 0.68rem; color: var(--text2); line-height: 1.6;
  }

  .globalbar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: rgba(13,14,18,0.92);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    padding: 9px 12px calc(9px + env(safe-area-inset-bottom));
    display: flex; gap: 8px; align-items: center;
  }
  .globalbar button {
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .playboth {
    flex: 1.3;
    background: var(--accent); color: #fff;
    border: none; border-radius: 9px;
    padding: 11px 0; font-size: 0.9rem; font-weight: 600;
  }
  .playboth:disabled { opacity: 0.45; }
  .speedbtn, .loopbtn, .restartbtn {
    flex: 1; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 9px;
    padding: 11px 0; font-size: 0.8rem;
  }
  select.speedbtn {
    -webkit-appearance: none; appearance: none;   /* ネイティブの矢印を消してボタンと揃える */
    text-align: center; text-align-last: center;
  }
  .loopbtn:disabled, .restartbtn:disabled { opacity: 0.45; }
  .loopbtn.on { color: var(--green); border-color: var(--green); }
</style>
</head>
<body>
  <header>
    <h1>video-compare</h1>
    <span class="note">動画はこの端末の外に出ません</span>
  </header>

  <main id="panels"></main>

  <p class="hint" id="hint">1. 動画を選ぶ → 2. 同じ場面で「A に設定」 → 3. 「Aから」で同時再生</p>

  <div class="globalbar">
    <button type="button" class="restartbtn" id="restartBtn" disabled aria-label="Aから同時再生"></button>
    <button type="button" class="playboth" id="playBothBtn" disabled aria-label="再生／一時停止"></button>
    <select class="speedbtn" id="speedSel" aria-label="再生速度">
      <option value="1">1.0×</option>
      <option value="0.75">0.75×</option>
      <option value="0.5">0.5×</option>
      <option value="0.25">0.25×</option>
    </select>
    <button type="button" class="loopbtn" id="loopBtn" disabled aria-label="ABループ"></button>
  </div>

  <template id="panelTpl">
    <section class="panel">
      <div class="video-area">
        <span class="badge"></span>
        <video playsinline muted preload="metadata" hidden></video>
        <button type="button" class="pick-btn"></button>
        <input type="file" accept="video/*" multiple hidden>
        <p class="err" hidden>この動画形式は再生できません</p>
      </div>
      <div class="ctrlrow">
        <button type="button" class="playone" disabled aria-label="単独再生"></button>
        <div class="seekwrap">
          <span class="amark" hidden>A</span>
          <span class="bmark" hidden>B</span>
          <input type="range" class="seek" min="0" max="0" step="0.01" value="0" disabled>
        </div>
        <span class="time"><b>0.00</b>/0.00</span>
        <button type="button" class="tune-toggle" aria-label="微調整・A/B設定"></button>
      </div>
      <div class="tune">
        <div class="tune-inner"><div class="tune-pad">
        <div class="steprow">
          <button type="button" data-d="-1" disabled>−1</button><button type="button" data-d="-0.1" disabled>−0.1</button><button type="button" data-d="-0.01" disabled>−0.01</button>
          <button type="button" data-d="0.01" disabled>+0.01</button><button type="button" data-d="0.1" disabled>+0.1</button><button type="button" data-d="1" disabled>+1</button>
        </div>
        <div class="abrow">
          <button type="button" class="aset" disabled>A に設定</button>
          <button type="button" class="bset" disabled>B に設定</button>
          <button type="button" class="repick">選び直す</button>
          <span class="abval"></span>
        </div>
        </div></div>
      </div>
    </section>
  </template>

<script>
"use strict";

// ===== 状態 =====
const state = {
  segLen: null,        // AB区間長（秒）。null = B未設定
  speed: 1,
  loop: false,
  playingBoth: false,
};
const panels = [];

const restartBtn = document.getElementById("restartBtn");
const playBothBtn = document.getElementById("playBothBtn");
const speedSel = document.getElementById("speedSel");
const loopBtn = document.getElementById("loopBtn");
const hintEl = document.getElementById("hint");

// ===== ユーティリティ =====
const fmt = (t) => Math.max(0, t).toFixed(2);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

// アイコン（Lucide https://lucide.dev — ISC License）
const ICONS = {
  play: '<polygon points="6 3 20 12 6 21 6 3"/>',
  pause: '<rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/>',
  rotateCcw: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
  repeat: '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
  settings: '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
};
const icon = (name, size = 18) =>
  `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;

// ===== パネル生成 =====
function createPanel(i) {
  const node = document.getElementById("panelTpl").content.cloneNode(true);
  const root = node.querySelector(".panel");
  const p = {
    i,
    root,
    video: root.querySelector("video"),
    badge: root.querySelector(".badge"),
    pickBtn: root.querySelector(".pick-btn"),
    fileInput: root.querySelector("input[type=file]"),
    err: root.querySelector(".err"),
    playone: root.querySelector(".playone"),
    seek: root.querySelector(".seek"),
    amark: root.querySelector(".amark"),
    bmark: root.querySelector(".bmark"),
    timeEl: root.querySelector(".time"),
    tuneToggle: root.querySelector(".tune-toggle"),
    tune: root.querySelector(".tune"),
    abval: root.querySelector(".abval"),
    aset: root.querySelector(".aset"),
    bset: root.querySelector(".bset"),
    repick: root.querySelector(".repick"),
    url: null,        // objectURL
    a: 0,             // A地点（この動画の時刻・秒）
    ready: false,     // 再生可能か
    dragging: false,  // シークバーをドラッグ中か
  };
  p.badge.textContent = `${i + 1}`;
  p.pickBtn.textContent = i === 0 ? "動画 1 を選ぶ（2本同時もOK）" : "動画 2 を選ぶ";
  p.tuneToggle.innerHTML = icon("settings", 16);
  p.playone.innerHTML = icon("play", 16);

  wireTuneToggle(p);
  wireLoading(p);
  wireSeek(p);
  wirePlayOne(p);
  wireAB(p);
  // ここに後続タスクの wire 呼び出しを追加していく

  document.getElementById("panels").appendChild(node);
  return p;
}

function wireTuneToggle(p) {
  p.tuneToggle.addEventListener("click", () => {
    const open = !p.tune.classList.contains("open");
    p.tune.classList.toggle("open", open);
    p.tuneToggle.classList.toggle("open", open);
  });
}

// ===== 動画読み込み =====
function wireLoading(p) {
  p.pickBtn.addEventListener("click", () => { p.fileInput.value = ""; p.fileInput.click(); });
  p.repick.addEventListener("click", () => { p.fileInput.value = ""; p.fileInput.click(); });

  p.fileInput.addEventListener("change", () => {
    const files = Array.from(p.fileInput.files);
    if (!files.length) return;
    loadFile(p, files[0]);
    if (files[1]) loadFile(panels[1 - p.i], files[1]);   // 2本選ばれたらもう片方のパネルにも割り当て
  });

  p.video.addEventListener("loadedmetadata", () => {
    p.ready = true;
    p.a = 0;
    resetSegment();   // 動画が替わったら区間・同時再生状態は無効化
    p.seek.max = p.video.duration.toFixed(2);
    p.seek.value = 0;
    updateControls();
  });

  p.video.addEventListener("error", () => {
    p.ready = false;
    p.err.hidden = false;
    p.video.hidden = true;
    p.pickBtn.hidden = false;
    updateControls();
  });
}

function loadFile(p, file) {
  if (p.url) URL.revokeObjectURL(p.url);
  p.url = URL.createObjectURL(file);
  p.ready = false;
  p.err.hidden = true;
  p.video.src = p.url;
  p.video.hidden = false;
  p.pickBtn.hidden = true;
  updateControls();
}

function resetSegment() {
  playBothRunning = false;   // シーク待ち中の playBoth を取り消す
  restarting = false;        // 進行中のループ再開も取り消す
  panels.forEach((q) => q.video.pause());   // 差し替え時にもう片方が再生し続けるのを防ぐ
  state.segLen = null;
  state.loop = false;
  state.playingBoth = false;
  segWasOver = false;
}

function updateControls() {
  const bothReady = panels.every((q) => q.ready);
  for (const q of panels) {
    q.playone.disabled = !q.ready;
    q.seek.disabled = !q.ready;
    q.aset.disabled = !q.ready;
    q.bset.disabled = !q.ready;
    for (const btn of q.root.querySelectorAll(".steprow button")) btn.disabled = !q.ready;
    q.abval.textContent = q.ready
      ? `A ${fmt(q.a)}` + (state.segLen != null ? ` ・ B ${fmt(q.a + state.segLen)}` : "")
      : "";
  }
  restartBtn.disabled = !bothReady;
  playBothBtn.disabled = !bothReady;
  playBothBtn.innerHTML = icon(state.playingBoth ? "pause" : "play");
  loopBtn.disabled = state.segLen == null;
  loopBtn.classList.toggle("on", state.loop);
  speedSel.value = String(state.speed);
  hintEl.textContent = bothReady
    ? "「A に設定」(歯車内) → 「Aから」で同時再生。再生ボタンは途中からの再開と停止。「B に設定」→ループで区間リピート"
    : "動画を2本選ぶと同時再生できます";
}

// ===== シーク操作 =====
function wireSeek(p) {
  p.seek.addEventListener("pointerdown", () => { p.dragging = true; });
  p.seek.addEventListener("pointerup", () => { p.dragging = false; });
  p.seek.addEventListener("pointercancel", () => { p.dragging = false; });
  p.seek.addEventListener("input", () => {
    if (!p.ready) return;
    p.video.currentTime = parseFloat(p.seek.value);
  });
  for (const btn of p.root.querySelectorAll(".steprow button")) {
    btn.addEventListener("click", () => stepSeek(p, parseFloat(btn.dataset.d)));
  }
}

function stepSeek(p, d) {
  if (!p.ready) return;
  p.video.pause();
  p.video.currentTime = clamp(p.video.currentTime + d, 0, p.video.duration);
}

// ===== 単独再生 =====
// play()はpause()との競合でAbortErrorを投げることがある（素早い連打等）ため、それだけ握りつぶす
function safePlay(v) {
  v.play().catch((e) => { if (e.name !== "AbortError") throw e; });
}

function wirePlayOne(p) {
  p.playone.addEventListener("click", () => {
    if (!p.ready) return;
    if (p.video.paused) {
      p.video.playbackRate = state.speed;
      safePlay(p.video);
    } else {
      p.video.pause();
      if (state.playingBoth) {
        state.playingBoth = false;
        updateControls();
      }
    }
  });
}

// ===== A/B・同時再生 =====
function wireAB(p) {
  p.aset.addEventListener("click", () => {
    p.a = p.video.currentTime;
    updateControls();
  });
  p.bset.addEventListener("click", () => {
    const len = p.video.currentTime - p.a;
    if (len <= 0) return;   // A地点より前はBにできない（設計書§4）
    if (len < 0.1) return;  // 0.1秒未満の極小区間はループが即時再発火し続けるため不可
    state.segLen = len;     // もう片方のBは「そのA＋同区間長」として自動決定
    segWasOver = false;     // 新しい区間で端検知をやり直す
    updateControls();
  });
}

// シーク完了を待つ（同じ位置へのシークで seeked が発火しない環境向けの保険つき。
// 旧端末ではシークに時間がかかるため500ms）
function seekAndWait(p, t) {
  return new Promise((resolve) => {
    const v = p.video;
    let done = false;
    let timer;
    const finish = () => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      v.removeEventListener("seeked", finish);
      resolve();
    };
    v.addEventListener("seeked", finish);
    v.currentTime = t;
    timer = setTimeout(finish, 500);
  });
}

// 同時再生の二重起動と「停止後にシーク完了で再生が復活する」競合を防ぐ
let playBothRunning = false;

async function playBoth() {
  if (playBothRunning) return;
  playBothRunning = true;
  panels.forEach((q) => q.video.pause());
  await Promise.all(panels.map((q) => seekAndWait(q, q.a)));
  if (!playBothRunning) return;   // シーク待ち中に pauseBoth で取り消された
  panels.forEach((q) => {
    q.video.playbackRate = state.speed;
    safePlay(q.video);
  });
  state.playingBoth = true;
  playBothRunning = false;
  updateControls();
}

function pauseBoth() {
  playBothRunning = false;   // シーク待ち中の playBoth を取り消す
  panels.forEach((q) => q.video.pause());
  state.playingBoth = false;
  updateControls();
}

// 一時停止位置からの再開（シークせず、いまの位置のまま両方を再生）
function resumeBoth() {
  if (playBothRunning) return;   // 「Aから」のシーク待ち中は無視
  if (panels.every((q) => q.video.ended)) return;   // 両方終了時は「Aから」で仕切り直す
  panels.forEach((q) => {
    if (q.video.ended) return;   // 終わった方は最後の位置のまま（play()の自動巻き戻しをさせない）
    q.video.playbackRate = state.speed;
    safePlay(q.video);
  });
  state.playingBoth = true;
  updateControls();
}

restartBtn.addEventListener("click", () => {
  if (!panels.every((q) => q.ready)) return;
  playBoth();
});

playBothBtn.addEventListener("click", () => {
  if (!panels.every((q) => q.ready)) return;
  if (state.playingBoth) pauseBoth();
  else resumeBoth();
});

// ===== ループ監視 =====
let restarting = false;

async function restartLoop() {
  if (restarting) return;
  restarting = true;
  await playBoth();
  restarting = false;
}

// 区間端の検知は「立ち上がり」のみ反応させる。B到達で一時停止したあと
// 再生ボタンで再開したとき、B以降もそのまま見続けられるようにするため
let segWasOver = false;

function checkSegment() {
  if (!state.playingBoth || state.segLen == null || restarting) return;
  const over = panels.some(
    (q) => q.video.currentTime - q.a >= state.segLen || q.video.ended
  );
  if (!over) { segWasOver = false; return; }
  if (segWasOver) return;
  segWasOver = true;
  if (state.loop) restartLoop();
  else pauseBoth();
}

loopBtn.addEventListener("click", () => {
  if (state.segLen == null) return;
  state.loop = !state.loop;
  updateControls();
});

// ===== 速度 =====
speedSel.addEventListener("change", () => {
  state.speed = parseFloat(speedSel.value);
  panels.forEach((q) => { q.video.playbackRate = state.speed; });
  updateControls();
});

// ===== UI更新ループ =====
function updatePanelUI(p) {
  if (!p.ready) return;
  const v = p.video;
  if (!p.dragging) p.seek.value = v.currentTime.toFixed(2);
  p.timeEl.innerHTML = `<b>${fmt(v.currentTime)}</b>/${fmt(v.duration)}`;
  const pos = (t) => `${clamp(t / v.duration, 0, 1) * 100}%`;
  p.amark.hidden = false;
  p.amark.style.left = pos(p.a);
  if (state.segLen != null) {
    p.bmark.hidden = false;
    p.bmark.style.left = pos(p.a + state.segLen);
  } else {
    p.bmark.hidden = true;
  }
  const glyph = v.paused ? "play" : "pause";
  if (p.playone.dataset.icon !== glyph) {
    p.playone.dataset.icon = glyph;
    p.playone.innerHTML = icon(glyph, 16);
  }
}

function tick() {
  checkSegment();
  panels.forEach(updatePanelUI);
  requestAnimationFrame(tick);
}

// ===== 起動 =====
restartBtn.innerHTML = icon("rotateCcw", 16) + "<span>Aから</span>";
loopBtn.innerHTML = icon("repeat", 16) + "<span>ループ</span>";
panels.push(createPanel(0), createPanel(1));
updateControls();
requestAnimationFrame(tick);
</script>
</body>
</html>
